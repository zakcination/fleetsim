name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + simulation tests (incl. zero-collision check)
        run: pytest
      - name: Smoke run
        run: fleetsim run --n 20 --allocator hungarian --ticks 600 --warmup 0 --load 1.2
