name: Release

# Push a tag like v0.2.0 to publish a GitHub release with the matching CHANGELOG section
# and the built wheel + sdist attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "fleetsim $GITHUB_REF_NAME" --notes-file notes.md
