name: Research question / experiment
description: A hypothesis you want to test with fleetsim.
labels: [research]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      placeholder: "e.g. Class-based pod storage raises throughput by >10% at 100 robots without hurting p95 wait."
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Experiment design
      description: Factors, levels, seeds/replications, metrics, baselines.
  - type: textarea
    id: refs
    attributes:
      label: Related work
